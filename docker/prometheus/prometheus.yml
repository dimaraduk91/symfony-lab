global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: symfony
    metrics_path: /metrics
    static_configs:
      - targets: ["roadrunner:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
