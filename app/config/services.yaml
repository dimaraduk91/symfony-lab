# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    kafka.brokers: '%env(KAFKA_BROKERS)%'
    redis.host: '%env(REDIS_HOST)%'
    redis.port: '%env(int:REDIS_PORT)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Ordering\Application\Outbox\Outbox: '@App\Ordering\Infrastructure\Outbox\DoctrineOutbox'
    App\Ordering\Application\Kafka\DomainEventPublisher: '@App\Ordering\Infrastructure\Kafka\KafkaDomainEventPublisher'
    App\Ordering\Infrastructure\Kafka\KafkaDomainEventPublisher:
        arguments:
            $brokers: '%kafka.brokers%'
    App\Ordering\Infrastructure\Kafka\KafkaConsumerFactory:
        arguments:
            $brokers: '%kafka.brokers%'

    Prometheus\CollectorRegistry:
        factory: ['App\Shared\Infrastructure\Observability\ObservabilityFactory', 'createMetricsRegistry']
        lazy: true
        arguments:
            $host: '%redis.host%'
            $port: '%redis.port%'

    OpenTelemetry\SDK\Trace\TracerProviderInterface:
        factory: ['App\Shared\Infrastructure\Observability\ObservabilityFactory', 'createTracerProvider']

    OpenTelemetry\API\Trace\TracerInterface:
        factory: ['@OpenTelemetry\SDK\Trace\TracerProviderInterface', 'getTracer']
        arguments: ['symfony-lab']

    App\Shared\Infrastructure\Observability\CorrelationLogProcessor:
        tags:
            - { name: monolog.processor }

